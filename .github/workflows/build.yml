name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip

      - name: Cache Buildozer Global (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: sdk-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            sdk-global-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          # نصب نسخه 1.5.0 بیلدوزر که stable تره و دست به p4a نمیزنه
          pip install --user --upgrade "buildozer==1.5.0" cython virtualenv

      # --- شاه‌کلید نهایی: دور زدن باگ بیلدوزر ---
      - name: Bypass p4a 3.14 Bug
        run: |
          # اگر پوشه p4a وجود نداشت، دستی آخرین نسخه سالم رو کلون میکنیم
          if [ ! -d ".buildozer/android/platform/python-for-android" ]; then
            git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android
          fi

      - name: Decode Keystore File
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Inject Keystore Config
        run: |
          echo "" >> buildozer.spec
          # دیگه هیچ تنظیماتی مربوط به p4a.branch اینجا نیست
          echo "android.release_keystore = ${{ github.workspace }}/release.keystore" >> buildozer.spec
          echo "android.release_key_alias = ${{ secrets.KEY_ALIAS }}" >> buildozer.spec
          echo "android.release_keystore_pw = ${{ secrets.KEYSTORE_PASSWORD }}" >> buildozer.spec
          echo "android.release_key_pw = ${{ secrets.KEY_PASSWORD }}" >> buildozer.spec

      - name: Build with Buildozer (Release)
        run: |
          export PATH=$PATH:~/.local/bin/
          export GITHUB_SHA=${{ github.sha }}
          buildozer android release

      - name: Cleanup Keystore File
        run: rm -f release.keystore
        if: always()

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK-${{ github.sha }}
          path: bin/*.apk