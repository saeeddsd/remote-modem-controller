name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --user --upgrade "buildozer==1.5.0" "cython==3.0.11" virtualenv

      # ═══ لایه ۱ و ۲: فریب دادن بیلدوزر در مسیرهای دقیق ═══
      - name: Prepare p4a and NDK
        run: |
          # ۱. کلون کدهای پایدار p4a در مسیر خانه
          git clone --depth 1 --single-branch --branch v2024.01.21 https://github.com/kivy/python-for-android.git /home/runner/p4a-src
          
          # ۲. فریب NDK: ساخت پوشه r25b و اتصال NDK از پیش نصب شده به آن
          mkdir -p /home/runner/.buildozer/android/platform
          rm -rf /home/runner/.buildozer/android/platform/android-ndk-r25b
          ln -s /usr/local/lib/android/sdk/ndk/25.2.9519653 /home/runner/.buildozer/android/platform/android-ndk-r25b

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Inject Buildozer Config
        run: |
          # پاک کردن تنظیمات قدیمی برای جلوگیری از تداخل
          sed -i '/^p4a.branch/d' buildozer.spec
          sed -i '/^p4a.source_dir/d' buildozer.spec
          sed -i '/^android.ndk/d' buildozer.spec
          sed -i '/^android.release_keystore/d' buildozer.spec
          sed -i '/^android.release_key_alias/d' buildozer.spec
          sed -i '/^android.release_keystore_pw/d' buildozer.spec
          sed -i '/^android.release_key_pw/d' buildozer.spec
          
          echo "" >> buildozer.spec
          echo "# ═══ CI Injected Config ═══" >> buildozer.spec
          echo "p4a.source_dir = /home/runner/p4a-src" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec
          echo "android.release_keystore = ${{ github.workspace }}/release.keystore" >> buildozer.spec
          echo "android.release_key_alias = ${{ secrets.KEY_ALIAS }}" >> buildozer.spec
          echo "android.release_keystore_pw = ${{ secrets.KEYSTORE_PASSWORD }}" >> buildozer.spec
          echo "android.release_key_pw = ${{ secrets.KEY_PASSWORD }}" >> buildozer.spec

      # ═══ لایه ۳: خاموش کردن سخت‌گیری Clang برای ارورهای C++ ═══
      - name: Build with Buildozer (Release)
        run: |
          set -o pipefail
          export PATH=$PATH:/home/runner/.local/bin
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export CFLAGS="-Wno-error=incompatible-function-pointer-types"
          export CXXFLAGS="-Wno-error=incompatible-function-pointer-types"
          buildozer android release 2>&1 | tee buildozer_full_log.txt

      - name: Print Real Error If Build Fails
        if: failure()
        run: |
          echo "=== ERROR REPORT ==="
          grep -i -A 5 -B 5 "error" buildozer_full_log.txt | tail -n 150 || true
          echo "=== LAST 100 LINES ==="
          tail -n 100 buildozer_full_log.txt

      - name: Cleanup Keystore File
        run: rm -f release.keystore
        if: always()

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Release-APK-${{ github.sha }}
          path: bin/*.apk