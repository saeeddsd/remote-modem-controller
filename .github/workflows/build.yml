name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip

      - name: Install Dependencies & Fix p4a Version
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          # نصب بیلدوزر
          pip install --user --upgrade "buildozer==1.5.0" "cython==3.0.11" virtualenv
          # ═══ نصب مستقیم نسخه پایدار p4a با pip (این ریشه مشکل پایتون ۳.۱۴ بود) ═══
          pip install --user --upgrade "git+https://github.com/kivy/python-for-android.git@v2024.01.21"

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Inject Buildozer Config
        run: |
          echo "" >> buildozer.spec
          echo "# ═══ CI Injected Config ═══" >> buildozer.spec
          echo "android.ndk = 23b" >> buildozer.spec
          echo "android.release_keystore = ${{ github.workspace }}/release.keystore" >> buildozer.spec
          echo "android.release_key_alias = ${{ secrets.KEY_ALIAS }}" >> buildozer.spec
          echo "android.release_keystore_pw = ${{ secrets.KEYSTORE_PASSWORD }}" >> buildozer.spec
          echo "android.release_key_pw = ${{ secrets.KEY_PASSWORD }}" >> buildozer.spec

      - name: Build with Buildozer (Release)
        env:
          # تزریق متغیرهای محیطی به عنوان قانون (بیلدوزر نمی‌تواند این‌ها را نادیده بگیرد)
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/23.2.7579858
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/23.2.7579858
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/23.2.7579858
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          set -o pipefail
          export PATH=$PATH:~/.local/bin/
          export GITHUB_SHA=${{ github.sha }}
          buildozer android release 2>&1 | tee buildozer_full_log.txt

      - name: Print Real Error If Build Fails
        if: failure()
        run: |
          echo "=== ERROR REPORT ==="
          grep -i -A 5 -B 5 "error" buildozer_full_log.txt | tail -n 150 || true
          echo "=== LAST 100 LINES ==="
          tail -n 100 buildozer_full_log.txt

      - name: Cleanup Keystore File
        run: rm -f release.keystore
        if: always()

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Release-APK-${{ github.sha }}
          path: bin/*.apk