name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip

      - name: Cache Buildozer Global (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: sdk-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            sdk-global-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --user --upgrade "buildozer==1.5.0" cython virtualenv

      - name: Fix Python Version Mismatch in buildozer.spec
        run: |
          sed -i 's/python3==3.11.4/python3/g' buildozer.spec
          sed -i '/^hostpython3/d' buildozer.spec

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Inject Buildozer Config (Fix libffi & NDK)
        run: |
          echo "" >> buildozer.spec
          echo "# ═══ CI Injected Config ═══" >> buildozer.spec
          echo "p4a.branch = v2024.07.05" >> buildozer.spec
          echo "android.ndk = 27b" >> buildozer.spec
          echo "android.release_keystore = ${{ github.workspace }}/release.keystore" >> buildozer.spec
          echo "android.release_key_alias = ${{ secrets.KEY_ALIAS }}" >> buildozer.spec
          echo "android.release_keystore_pw = ${{ secrets.KEYSTORE_PASSWORD }}" >> buildozer.spec
          echo "android.release_key_pw = ${{ secrets.KEY_PASSWORD }}" >> buildozer.spec

      - name: Build with Buildozer (Release)
        run: |
          export PATH=$PATH:~/.local/bin/
          export GITHUB_SHA=${{ github.sha }}
          buildozer android release

      - name: Cleanup Keystore File
        run: rm -f release.keystore
        if: always()

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK-${{ github.sha }}
          path: bin/*.apk