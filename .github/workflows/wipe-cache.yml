name: Wipe All Caches
on: workflow_dispatch

permissions:
  actions: write

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all repository caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install actions/gh-actions-cache
          echo "Finding and deleting all caches..."
          gh actions-cache list --limit 100 | cut -f1 | xargs -n1 gh actions-cache delete --confirm
          echo "All caches successfully wiped out!"